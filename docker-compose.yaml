services:
  tml:
    container_name: terraria
    restart: unless-stopped

    build:
      context: .
      args:
        # Pin the tModLoader release. Unset builds the latest GitHub release, which
        # means a rebuild can silently move versions — and a world saved by a newer
        # build will not open on an older one.
        TMLVERSION: ${TMLVERSION}
        # Baked at build time, not runtime (upstream limitation). Match these to the
        # host account that should own the world files, or everything lands as uid
        # 1000 regardless of who runs the stack.
        UID: ${TML_UID}
        GID: ${TML_GID}

    ports:
      - "${TML_PORT}:7777"

    # Deliberately NO tty/stdin_open. The server's stdin comes from a FIFO instead
    # (see bin/tml-entrypoint.sh), so there is no interactive session for a stray
    # Ctrl-C to stop. Commands go in with `tcon`, output comes out via `docker logs`.
    entrypoint: ["/bin/bash", "/usr/local/bin/tml-entrypoint.sh"]

    # The world is written on shutdown. Docker's default 10s SIGTERM grace is not
    # enough for a large modded world, and being killed mid-write is how saves get
    # corrupted.
    stop_grace_period: 120s

    volumes:
      - ${DATA_DIR}:/tModLoader
      # Mounted read-only rather than baked in, so the upstream Dockerfile stays
      # untouched and these can be edited without a rebuild.
      - ./bin/tml-entrypoint.sh:/usr/local/bin/tml-entrypoint.sh:ro
      - ./bin/tcon:/usr/local/bin/tcon:ro

    logging:
      driver: journald
